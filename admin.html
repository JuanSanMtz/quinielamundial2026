<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Quiniela Mundial 2026</title>

<style>

body{
  font-family:Arial;
  background:#eef2f7;
  margin:0;
}

header{
  background:#1e3c72;
  color:white;
  text-align:center;
  padding:18px;
  font-size:24px;
  font-weight:bold;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

input{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  margin-bottom:10px;
  box-sizing:border-box;
}

button.guardar{
  width:100%;
  padding:14px;
  margin-top:10px;
  background:#1e3c72;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

button.guardar:hover{
  background:#294f96;
}

.grupo-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.grupo-title{
  font-size:24px;
  font-weight:bold;
  color:#1e3c72;
}

.nav-btn{
  width:45px;
  height:45px;
  border:none;
  border-radius:50%;
  background:#1e3c72;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.jornada{
  background:#dfe7f5;
  padding:10px;
  border-radius:8px;
  margin-top:15px;
  margin-bottom:10px;
  font-weight:bold;
}

.partido{
  display:grid;
  grid-template-columns:1fr 60px 60px 1fr;
  gap:10px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.team{
  text-align:center;
  font-weight:bold;
  font-size:14px;
}

.marcador{
  text-align:center;
}

.extra-title{
  background:#ffedd5;
  color:#9a3412;
  padding:10px;
  border-radius:8px;
  margin-top:20px;
  margin-bottom:10px;
  font-weight:bold;
  text-align:center;
}

.info{
  background:#fff4d6;
  border:1px solid #ffe08a;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
}

.indicadores{
  text-align:center;
  margin-top:15px;
}

.dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ccc;
  margin:4px;
}

.dot.active{
  background:#1e3c72;
}

</style>

</head>

<body>

<header>
🔐 Admin Quiniela Mundial 2026
</header>

<div class="container">

<!-- LOGIN -->

<div
  class="card"
  id="loginCard"
>

<h2>🔐 Acceso Admin</h2>

<input
  id="user"
  placeholder="Usuario"
>

<input
  id="pass"
  type="password"
  placeholder="Contraseña"
>

<button
  class="guardar"
  onclick="login()"
>
Entrar
</button>

</div>

<!-- PANEL -->

<div
  id="panelAdmin"
  style="display:none;"
>

<!-- RESULTADOS -->

<div class="card">

<div class="info">
🏆 Captura los resultados reales.
</div>

<div class="grupo-header">

<button
  class="nav-btn"
  onclick="grupoAnterior()"
>
<
</button>

<div
  class="grupo-title"
  id="grupoTitulo"
>
Grupo A
</div>

<button
  class="nav-btn"
  onclick="grupoSiguiente()"
>
>
</button>

</div>

<div id="partidos"></div>

<div id="extras"></div>

<div
  class="indicadores"
  id="indicadores"
></div>

<button
  class="guardar"
  onclick="guardarResultados()"
>
💾 Guardar Resultados
</button>

</div>

<!-- EXTRA -->

<div class="card">

<h2>➕ Agregar Partido Extra</h2>

<input
  id="faseExtra"
  placeholder="Fase"
>

<input
  id="localExtra"
  placeholder="Equipo local"
>

<input
  id="visitanteExtra"
  placeholder="Equipo visitante"
>

<button
  class="guardar"
  onclick="agregarPartidoExtra()"
>
➕ Agregar Partido
</button>

</div>

<!-- RESET -->

<div class="card">

<button
  class="guardar"
  style="background:#c62828;"
  onclick="resetearDB()"
>
🗑️ Reiniciar Quiniela
</button>

</div>

</div>

</div>

<script src="partidos.js"></script>

<script>

/* =========================================
   LOGIN
========================================= */

function login(){

  const u =
    document.getElementById("user").value;

  const p =
    document.getElementById("pass").value;

  if(
    u === "admin" &&
    p === "1234"
  ){

    document.getElementById(
      "loginCard"
    ).style.display = "none";

    document.getElementById(
      "panelAdmin"
    ).style.display = "block";

    renderPartidos();

    cargarExtras();

  }else{

    alert("❌ Credenciales incorrectas");

  }

}

/* =========================================
   VARIABLES
========================================= */

const grupos = [
  "A","B","C","D","E","F",
  "G","H","I","J","K","L"
];

let indiceGrupo = 0;

let memoria = {};

let partidosExtras = [];

/* =========================================
   CARGAR EXTRAS
========================================= */

async function cargarExtras(){

  try{

    const res =
      await fetch(
        "http://localhost:3000/todos-partidos"
      );

    const data =
      await res.json();

    partidosExtras =
      data.extras || [];

    renderExtras();

  }catch(e){

    console.error(e);

  }

}

/* =========================================
   RENDER EXTRAS
========================================= */

function renderExtras(){

  let html = "";

  partidosExtras.forEach((p)=>{

    html += `

    <div class="extra-title">
      ⚔️ ${p.fase}
    </div>

    <div class="partido">

      <div class="team">
        ${p.local}
      </div>

      <input
        type="number"
        class="marcador"
        id="glExtra${p.id}"
        min="0"
        placeholder="0"
      >

      <input
        type="number"
        class="marcador"
        id="gvExtra${p.id}"
        min="0"
        placeholder="0"
      >

      <div class="team">
        ${p.visitante}
      </div>

    </div>

    `;

  });

  document.getElementById(
    "extras"
  ).innerHTML = html;

}

/* =========================================
   RENDER PARTIDOS
========================================= */

function renderPartidos(){

  const grupoActual =
    grupos[indiceGrupo];

  document.getElementById(
    "grupoTitulo"
  ).innerHTML =
    `Grupo ${grupoActual}`;

  let html = "";

  let jornadaActual = "";

  const partidosGrupo = partidos.filter(
    p => p.grupo === grupoActual
  );

  partidosGrupo.forEach((p)=>{

    if(jornadaActual !== p.jornada){

      jornadaActual = p.jornada;

      html += `

      <div class="jornada">
        Jornada ${jornadaActual}
      </div>

      `;

    }

    html += `

    <div class="partido">

      <div class="team">
        ${p.local}
      </div>

      <input
        type="number"
        class="marcador"
        id="gl${p.id}"
        min="0"
      >

      <input
        type="number"
        class="marcador"
        id="gv${p.id}"
        min="0"
      >

      <div class="team">
        ${p.visitante}
      </div>

    </div>

    `;

  });

  document.getElementById(
    "partidos"
  ).innerHTML = html;

  renderIndicadores();

}

/* =========================================
   INDICADORES
========================================= */

function renderIndicadores(){

  let html = "";

  grupos.forEach((g,i)=>{

    html += `

    <span class="
      dot
      ${i === indiceGrupo ? 'active' : ''}
    "></span>

    `;

  });

  document.getElementById(
    "indicadores"
  ).innerHTML = html;

}

/* =========================================
   NAVEGACIÓN
========================================= */

function grupoSiguiente(){

  if(indiceGrupo < grupos.length - 1){

    indiceGrupo++;

    renderPartidos();

  }

}

function grupoAnterior(){

  if(indiceGrupo > 0){

    indiceGrupo--;

    renderPartidos();

  }

}

/* =========================================
   GUARDAR RESULTADOS
========================================= */

async function guardarResultados(){

  try{

    partidos.forEach(async(p)=>{

      const gl =
        document.getElementById(`gl${p.id}`);

      const gv =
        document.getElementById(`gv${p.id}`);

      if(!gl || !gv) return;

      if(gl.value === "" || gv.value === ""){
        return;
      }

      await fetch(

        "http://localhost:3000/guardar-resultado",

        {

          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({

            partidoId:p.id,

            golesLocal:parseInt(gl.value),

            golesVisitante:parseInt(gv.value)

          })

        }

      );

    });

    partidosExtras.forEach(async(p)=>{

      const gl =
        document.getElementById(
          `glExtra${p.id}`
        );

      const gv =
        document.getElementById(
          `gvExtra${p.id}`
        );

      if(!gl || !gv) return;

      if(gl.value === "" || gv.value === ""){
        return;
      }

      await fetch(

        "http://localhost:3000/guardar-resultado",

        {

          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({

            partidoId:p.id,

            golesLocal:parseInt(gl.value),

            golesVisitante:parseInt(gv.value)

          })

        }

      );

    });

    alert("🔥 Resultados guardados");

  }catch(e){

    console.error(e);

    alert("❌ Error");

  }

}

/* =========================================
   AGREGAR EXTRA
========================================= */

async function agregarPartidoExtra(){

  const fase =
    document.getElementById("faseExtra").value;

  const local =
    document.getElementById("localExtra").value;

  const visitante =
    document.getElementById("visitanteExtra").value;

  if(!fase || !local || !visitante){

    alert("Completa todos los campos");

    return;
  }

  const nuevo = {

    id:Date.now(),

    fase,

    local,

    visitante

  };

  try{

    await fetch(

      "http://localhost:3000/agregar-partido",

      {

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify(nuevo)

      }

    );

    alert("🔥 Partido agregado");

    cargarExtras();

  }catch(e){

    console.error(e);

  }

}

/* =========================================
   RESET
========================================= */

async function resetearDB(){

  const ok = confirm(
    "⚠️ ¿Borrar toda la quiniela?"
  );

  if(!ok) return;

  await fetch(

    "http://localhost:3000/reset",

    {
      method:"POST"
    }

  );

  alert("🔥 Quiniela reiniciada");

  location.reload();

}

</script>

</body>

</html>
