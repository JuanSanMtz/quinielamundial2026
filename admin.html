<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Quiniela Mundial 2026</title>

<style>

body{
  font-family:Arial;
  background:#eef2f7;
  margin:0;
}

header{
  background:#1e3c72;
  color:white;
  text-align:center;
  padding:18px;
  font-size:24px;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.grupo-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.grupo-title{
  font-size:24px;
  font-weight:bold;
  color:#1e3c72;
}

.nav-btn{
  width:45px;
  height:45px;
  border:none;
  border-radius:50%;
  background:#1e3c72;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.nav-btn:hover{
  background:#294f96;
}

.partido{
  display:grid;
  grid-template-columns:1fr 70px 70px 1fr;
  gap:10px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.team{
  text-align:center;
  font-weight:bold;
}

input{
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  text-align:center;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
}

.btn-guardar{
  background:#1e3c72;
}

.btn-ranking{
  background:#15803d;
}

.btn-user{
  background:#ea580c;
}

.btn-reset{
  background:#dc2626;
}

button:hover{
  opacity:.9;
}

.indicadores{
  text-align:center;
  margin-top:15px;
}

.dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ccc;
  margin:4px;
}

.dot.active{
  background:#1e3c72;
}

.tools-grid{
  display:grid;
  gap:15px;
}

.alert-box{
  background:#fee2e2;
  border:1px solid #fecaca;
  color:#991b1b;
  padding:12px;
  border-radius:10px;
  margin-top:15px;
  font-size:14px;
}

</style>

</head>

<body>

<header>
🛠️ Admin Mundial 2026
</header>

<div class="container">

<!-- RESULTADOS -->

<div class="card">

<div class="grupo-header">

<button
  class="nav-btn"
  onclick="grupoAnterior()"
>
<
</button>

<div
  class="grupo-title"
  id="grupoTitulo"
>
Grupo A
</div>

<button
  class="nav-btn"
  onclick="grupoSiguiente()"
>
>
</button>

</div>

<div id="partidos"></div>

<div
  class="indicadores"
  id="indicadores"
></div>

<button
  class="btn-guardar"
  onclick="guardarResultadosGrupo()"
>
💾 Guardar Resultados Grupo
</button>

<button
  class="btn-ranking"
  onclick="calcularPuntos()"
>
⚡ Calcular Ranking
</button>

</div>

<!-- HERRAMIENTAS -->

<div class="card">

<h2>🧨 Herramientas Admin</h2>

<div class="tools-grid">

<input
  id="usuarioEliminar"
  placeholder="Nombre usuario a eliminar"
/>

<button
  class="btn-user"
  onclick="eliminarUsuario()"
>
❌ Eliminar Usuario
</button>

<button
  class="btn-reset"
  onclick="resetRanking()"
>
🏆 Reiniciar Ranking
</button>

<div class="alert-box">
⚠️ Reiniciar Mundial eliminará:
quinielas, ranking y resultados.
</div>

<button
  class="btn-reset"
  onclick="resetMundial()"
>
🧨 Reiniciar Mundial Completo
</button>

</div>

</div>

</div>

<script src="partidos.js"></script>

<script>

/* =========================================
   VARIABLES
========================================= */

const grupos = [
  "A","B","C","D","E","F",
  "G","H","I","J","K","L"
];

let indiceGrupo = 0;

/* =========================================
   RENDER PARTIDOS
========================================= */

function renderPartidos(){

  const grupoActual =
    grupos[indiceGrupo];

  document.getElementById(
    "grupoTitulo"
  ).innerHTML =
    `Grupo ${grupoActual}`;

  let html = "";

  const partidosGrupo =
    partidos.filter(
      p => p.grupo === grupoActual
    );

  partidosGrupo.forEach((p)=>{

    html += `

    <div class="partido">

      <div class="team">
        ${p.local}
      </div>

      <input
        type="number"
        id="gl${p.id}"
        min="0"
        value="0"
      >

      <input
        type="number"
        id="gv${p.id}"
        min="0"
        value="0"
      >

      <div class="team">
        ${p.visitante}
      </div>

    </div>

    `;

  });

  document.getElementById(
    "partidos"
  ).innerHTML = html;

  renderIndicadores();

  cargarResultadosGrupo();

}

/* =========================================
   INDICADORES
========================================= */

function renderIndicadores(){

  let html = "";

  grupos.forEach((g,i)=>{

    html += `

    <span class="
      dot
      ${i === indiceGrupo ? 'active' : ''}
    "></span>

    `;

  });

  document.getElementById(
    "indicadores"
  ).innerHTML = html;

}

/* =========================================
   NAVEGACIÓN
========================================= */

function grupoSiguiente(){

  if(indiceGrupo < grupos.length - 1){

    indiceGrupo++;

    renderPartidos();

  }

}

function grupoAnterior(){

  if(indiceGrupo > 0){

    indiceGrupo--;

    renderPartidos();

  }

}

/* =========================================
   GUARDAR RESULTADOS GRUPO
========================================= */

async function guardarResultadosGrupo(){

  try{

    const grupoActual =
      grupos[indiceGrupo];

    const partidosGrupo =
      partidos.filter(
        p => p.grupo === grupoActual
      );

    let data = [];

    partidosGrupo.forEach((p)=>{

      const gl =
        document.getElementById(
          `gl${p.id}`
        ).value;

      const gv =
        document.getElementById(
          `gv${p.id}`
        ).value;

      data.push({

        partidoId:p.id,

        golesLocal:
          parseInt(gl),

        golesVisitante:
          parseInt(gv)

      });

    });

    await firebaseSet(

      firebaseRef(
        db,
        `resultados/${grupoActual}`
      ),

      data

    );

    alert(
      `🔥 Resultados Grupo ${grupoActual} guardados`
    );

  }catch(e){

    console.error(e);

    alert(
      "❌ Error guardando"
    );

  }

}

/* =========================================
   CARGAR RESULTADOS
========================================= */

async function cargarResultadosGrupo(){

  try{

    const grupoActual =
      grupos[indiceGrupo];

    const res =
      await fetch(

        `https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/resultados/${grupoActual}.json`

      );

    const data =
      await res.json();

    if(!data) return;

    data.forEach((p)=>{

      const gl =
        document.getElementById(
          `gl${p.partidoId}`
        );

      const gv =
        document.getElementById(
          `gv${p.partidoId}`
        );

      if(gl && gv){

        gl.value =
          p.golesLocal;

        gv.value =
          p.golesVisitante;

      }

    });

  }catch(e){

    console.error(e);

  }

}

/* =========================================
   CALCULAR PUNTOS
========================================= */

async function calcularPuntos(){

  try{

    const resResultados =
      await fetch(

        "https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/resultados.json"

      );

    const resultados =
      await resResultados.json();

    const resQuinielas =
      await fetch(

        "https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/quinielas.json"

      );

    const quinielas =
      await resQuinielas.json();

    if(!quinielas || !resultados){

      alert(
        "❌ Faltan datos"
      );

      return;

    }

    for(const usuario in quinielas){

      let puntos = 0;

      let exactos = 0;

      const gruposUsuario =
        quinielas[usuario].grupos || {};

      for(const grupo in gruposUsuario){

        const pronosticos =
          gruposUsuario[grupo].pronosticos || [];

        const resultadosGrupo =
          resultados[grupo];

        if(!resultadosGrupo){

          continue;

        }

        pronosticos.forEach((p)=>{

          const real =
            resultadosGrupo.find(

              r =>

                Number(r.partidoId) ===
                Number(p.partidoId)

            );

          if(!real) return;

          if(

            p.golesLocal === real.golesLocal &&

            p.golesVisitante === real.golesVisitante

          ){

            exactos++;

          }

          const resultadoPronostico =

            p.golesLocal > p.golesVisitante
            ? "L"

            : p.golesLocal < p.golesVisitante
            ? "V"

            : "E";

          const resultadoReal =

            real.golesLocal > real.golesVisitante
            ? "L"

            : real.golesLocal < real.golesVisitante
            ? "V"

            : "E";

          if(
            resultadoPronostico === resultadoReal
          ){

            puntos++;

          }

        });

      }

      await firebaseSet(

        firebaseRef(
          db,
          `ranking/${usuario}`
        ),

        {

          usuario,

          puntos,

          exactos

        }

      );

    }

    alert(
      "🔥 Ranking calculado"
    );

  }catch(e){

    console.error(e);

    alert(
      "❌ Error calculando"
    );

  }

}

/* =========================================
   ELIMINAR USUARIO
========================================= */

async function eliminarUsuario(){

  const usuario =
    document.getElementById(
      "usuarioEliminar"
    ).value;

  if(!usuario){

    alert(
      "Escribe usuario"
    );

    return;

  }

  const ok =
    confirm(

      `¿Eliminar completamente a ${usuario}?`

    );

  if(!ok) return;

  try{

    await firebaseRemove(

      firebaseRef(
        db,
        `quinielas/${usuario}`
      )

    );

    await firebaseRemove(

      firebaseRef(
        db,
        `ranking/${usuario}`
      )

    );

    alert(
      `🔥 Usuario ${usuario} eliminado`
    );

  }catch(e){

    console.error(e);

    alert(
      "❌ Error eliminando usuario"
    );

  }

}

/* =========================================
   RESET RANKING
========================================= */

async function resetRanking(){

  const ok =
    confirm(

      "¿Eliminar TODO el ranking?"

    );

  if(!ok) return;

  try{

    await firebaseRemove(

      firebaseRef(
        db,
        "ranking"
      )

    );

    alert(
      "🔥 Ranking reiniciado"
    );

  }catch(e){

    console.error(e);

    alert(
      "❌ Error reset ranking"
    );

  }

}

/* =========================================
   RESET MUNDIAL
========================================= */

async function resetMundial(){

  const ok =
    confirm(

      "⚠️ ESTO BORRARÁ TODO EL MUNDIAL ¿Continuar?"

    );

  if(!ok) return;

  try{

    await firebaseRemove(

      firebaseRef(
        db,
        "quinielas"
      )

    );

    await firebaseRemove(

      firebaseRef(
        db,
        "ranking"
      )

    );

    await firebaseRemove(

      firebaseRef(
        db,
        "resultados"
      )

    );

    alert(
      "🔥 Mundial reiniciado"
    );

  }catch(e){

    console.error(e);

    alert(
      "❌ Error reiniciando"
    );

  }

}

/* =========================================
   INIT
========================================= */

renderPartidos();

</script>
