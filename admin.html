<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Mundial 2026</title>

<style>

body{
  font-family:Arial;
  background:#eef2f7;
  margin:0;
}

header{
  background:#1e3c72;
  color:white;
  text-align:center;
  padding:18px;
  font-size:24px;
  font-weight:bold;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.hidden{
  display:none;
}

input{
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
}

.btn-login{
  background:#1e3c72;
}

.btn-guardar{
  background:#2563eb;
}

.btn-ranking{
  background:#15803d;
}

.btn-danger{
  background:#dc2626;
}

.btn-warning{
  background:#ea580c;
}

.grupo-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.nav-btn{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#1e3c72;
}

.partido{
  display:grid;
  grid-template-columns:1fr 60px 60px 1fr;
  gap:10px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.team{
  text-align:center;
  font-weight:bold;
}

.tabla-ranking{
  width:100%;
  border-collapse:collapse;
}

.tabla-ranking th,
.tabla-ranking td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

.tabla-ranking th{
  background:#1e3c72;
  color:white;
}

</style>

</head>

<body>

<header>
🛠️ Admin Mundial 2026
</header>

<div class="container">

<!-- LOGIN -->

<div class="card" id="loginCard">

<h2>🔒 Acceso Admin</h2>

<input
  id="adminUser"
  placeholder="Usuario"
>

<br><br>

<input
  id="adminPass"
  type="password"
  placeholder="Contraseña"
>

<button
  class="btn-login"
  onclick="loginAdmin()"
>
Ingresar
</button>

</div>

<!-- PANEL ADMIN -->

<div
  id="panelAdmin"
  class="hidden"
>

<!-- RESULTADOS -->

<div class="card">

<div class="grupo-header">

<button
  class="nav-btn"
  onclick="grupoAnterior()"
>
<
</button>

<h2 id="grupoTitulo">
Grupo A
</h2>

<button
  class="nav-btn"
  onclick="grupoSiguiente()"
>
>
</button>

</div>

<div id="partidos"></div>

<button
  class="btn-guardar"
  onclick="guardarResultadosGrupo()"
>
💾 Guardar Resultados Grupo
</button>

<button
  class="btn-ranking"
  onclick="calcularPuntos()"
>
⚡ Actualizar Ranking
</button>

</div>

<!-- TABLA RANKING -->

<div class="card">

<h2>🏆 Ranking Actual</h2>

<table class="tabla-ranking">

<thead>

<tr>
<th>#</th>
<th>Usuario</th>
<th>Puntos</th>
<th>Exactos</th>
</tr>

</thead>

<tbody id="tablaRanking"></tbody>

</table>

</div>

<!-- HERRAMIENTAS -->

<div class="card">

<h2>🧨 Herramientas Admin</h2>

<input
  id="usuarioEliminar"
  placeholder="Usuario a eliminar"
>

<button
  class="btn-warning"
  onclick="eliminarUsuario()"
>
❌ Eliminar Usuario
</button>

<button
  class="btn-danger"
  onclick="resetRanking()"
>
🏆 Reiniciar Ranking
</button>

<button
  class="btn-danger"
  onclick="resetMundial()"
>
🧨 Reiniciar Mundial
</button>

</div>

</div>

</div>

<script src="partidos.js"></script>

<script>

const grupos = [
  'A','B','C','D','E','F',
  'G','H','I','J','K','L'
];

let indiceGrupo = 0;

/* LOGIN */

function loginAdmin(){

  const user =
    document.getElementById(
      'adminUser'
    ).value;

  const pass =
    document.getElementById(
      'adminPass'
    ).value;

  if(
    user === 'admin' &&
    pass === '1234'
  ){

    document.getElementById(
      'loginCard'
    ).classList.add('hidden');

    document.getElementById(
      'panelAdmin'
    ).classList.remove('hidden');

    renderPartidos();

    cargarRankingTabla();

  }else{

    alert(
      '❌ Acceso incorrecto'
    );

  }

}

/* RENDER PARTIDOS */

function renderPartidos(){

  const grupoActual =
    grupos[indiceGrupo];

  document.getElementById(
    'grupoTitulo'
  ).innerHTML =
    `Grupo ${grupoActual}`;

  let html = '';

  const partidosGrupo =
    partidos.filter(
      p => p.grupo === grupoActual
    );

  partidosGrupo.forEach((p)=>{

    html += `

    <div class="partido">

      <div class="team">
        ${p.local}
      </div>

      <input
        type="number"
        id="gl${p.id}"
        value="0"
      >

      <input
        type="number"
        id="gv${p.id}"
        value="0"
      >

      <div class="team">
        ${p.visitante}
      </div>

    </div>

    `;

  });

  document.getElementById(
    'partidos'
  ).innerHTML = html;

  cargarResultadosGrupo();

}

/* NAVEGACION */

function grupoSiguiente(){

  if(
    indiceGrupo <
    grupos.length - 1
  ){

    indiceGrupo++;

    renderPartidos();

  }

}

function grupoAnterior(){

  if(indiceGrupo > 0){

    indiceGrupo--;

    renderPartidos();

  }

}

/* GUARDAR RESULTADOS */

async function guardarResultadosGrupo(){

  const grupoActual =
    grupos[indiceGrupo];

  const partidosGrupo =
    partidos.filter(
      p => p.grupo === grupoActual
    );

  let data = [];

  partidosGrupo.forEach((p)=>{

    data.push({

      partidoId:p.id,

      golesLocal:parseInt(

        document.getElementById(
          `gl${p.id}`
        ).value

      ),

      golesVisitante:parseInt(

        document.getElementById(
          `gv${p.id}`
        ).value

      )

    });

  });

  await firebaseSet(

    firebaseRef(
      db,
      `resultados/${grupoActual}`
    ),

    data

  );

  alert(
    '🔥 Resultados guardados'
  );

}

/* CARGAR RESULTADOS */

async function cargarResultadosGrupo(){

  const grupoActual =
    grupos[indiceGrupo];

  const res = await fetch(

    `https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/resultados/${grupoActual}.json`

  );

  const data =
    await res.json();

  if(!data) return;

  data.forEach((p)=>{

    const gl =
      document.getElementById(
        `gl${p.partidoId}`
      );

    const gv =
      document.getElementById(
        `gv${p.partidoId}`
      );

    if(gl && gv){

      gl.value =
        p.golesLocal;

      gv.value =
        p.golesVisitante;

    }

  });

}

/* CALCULAR RANKING */

async function calcularPuntos(){

  const resResultados =
    await fetch(

      'https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/resultados.json'

    );

  const resultados =
    await resResultados.json();

  const resQuinielas =
    await fetch(

      'https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/quinielas.json'

    );

  const quinielas =
    await resQuinielas.json();

  for(const usuario in quinielas){

    let puntos = 0;

    let exactos = 0;

    const gruposUsuario =
      quinielas[usuario].grupos || {};

    for(const grupo in gruposUsuario){

      const pronosticos =
        gruposUsuario[grupo]
        .pronosticos || [];

      const resultadosGrupo =
        resultados[grupo];

      if(!resultadosGrupo){

        continue;

      }

      pronosticos.forEach((p)=>{

        const real =
          resultadosGrupo.find(

            r =>

              Number(r.partidoId) ===
              Number(p.partidoId)

          );

        if(!real) return;

        if(

          p.golesLocal ===
          real.golesLocal &&

          p.golesVisitante ===
          real.golesVisitante

        ){

          exactos++;

        }

        const pronostico =

          p.golesLocal >
          p.golesVisitante

          ? 'L'

          : p.golesLocal <
            p.golesVisitante

          ? 'V'

          : 'E';

        const realResultado =

          real.golesLocal >
          real.golesVisitante

          ? 'L'

          : real.golesLocal <
            real.golesVisitante

          ? 'V'

          : 'E';

        if(
          pronostico ===
          realResultado
        ){

          puntos++;

        }

      });

    }

    await firebaseSet(

      firebaseRef(
        db,
        `ranking/${usuario}`
      ),

      {

        usuario,

        puntos,

        exactos

      }

    );

  }

  cargarRankingTabla();

  alert(
    '🔥 Ranking actualizado'
  );

}

/* TABLA RANKING */

async function cargarRankingTabla(){

  const res =
    await fetch(

      'https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/ranking.json'

    );

  const data =
    await res.json();

  if(!data) return;

  const ranking =
    Object.values(data);

  ranking.sort((a,b)=>{

    if(
      b.puntos !==
      a.puntos
    ){

      return (
        b.puntos -
        a.puntos
      );

    }

    return (
      b.exactos -
      a.exactos
    );

  });

  let html = '';

  ranking.forEach((r,i)=>{

    html += `

    <tr>

      <td>${i+1}</td>

      <td>${r.usuario}</td>

      <td>${r.puntos}</td>

      <td>${r.exactos}</td>

    </tr>

    `;

  });

  document.getElementById(
    'tablaRanking'
  ).innerHTML = html;

}

/* ELIMINAR USUARIO */

async function eliminarUsuario(){

  const usuario =
    document.getElementById(
      'usuarioEliminar'
    ).value;

  if(!usuario) return;

  await firebaseRemove(

    firebaseRef(
      db,
      `quinielas/${usuario}`
    )

  );

  await firebaseRemove(

    firebaseRef(
      db,
      `ranking/${usuario}`
    )

  );

  alert(
    '🔥 Usuario eliminado'
  );

  cargarRankingTabla();

}

/* RESET RANKING */

async function resetRanking(){

  const ok = confirm(
    '¿Eliminar ranking completo?'
  );

  if(!ok) return;

  await firebaseRemove(

    firebaseRef(
      db,
      'ranking'
    )

  );

  cargarRankingTabla();

  alert(
    '🔥 Ranking eliminado'
  );

}

/* RESET MUNDIAL */

async function resetMundial(){

  const ok = confirm(
    '⚠️ Se borrará TODO'
  );

  if(!ok) return;

  await firebaseRemove(

    firebaseRef(
      db,
      'ranking'
    )

  );

  await firebaseRemove(

    firebaseRef(
      db,
      'quinielas'
    )

  );

  await firebaseRemove(

    firebaseRef(
      db,
      'resultados'
    )

  );

  alert(
    '🔥 Mundial reiniciado'
  );

}

</script>
