<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Mundial 2026</title>

<style>

body{
  font-family:Arial;
  background:#eef2f7;
  margin:0;
}

header{
  background:#1e3c72;
  color:white;
  text-align:center;
  padding:18px;
  font-size:24px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.hidden{
  display:none;
}

input,
select{
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  box-sizing:border-box;
  width:100%;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
}

.btn-login{
  background:#1e3c72;
}

.btn-guardar{
  background:#2563eb;
}

.btn-ranking{
  background:#15803d;
}

.btn-final{
  background:#7c3aed;
}

.btn-danger{
  background:#b91c1c;
}

.grupo-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.nav-btn{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#1e3c72;
}

.partido{
  display:grid;
  grid-template-columns:1fr 70px 70px 1fr;
  gap:10px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.team{
  text-align:center;
  font-weight:bold;
}

.jornada{
  background:#dfe7f5;
  padding:10px;
  border-radius:8px;
  margin-top:15px;
  margin-bottom:10px;
  font-weight:bold;
}

.tabla-ranking{
  width:100%;
  border-collapse:collapse;
}

.tabla-ranking th,
.tabla-ranking td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

.tabla-ranking th{
  background:#1e3c72;
  color:white;
}

.grid-final{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.fase-label{
  background:#ede9fe;
  padding:10px;
  border-radius:8px;
  margin-top:20px;
  margin-bottom:10px;
  font-weight:bold;
  color:#5b21b6;
  font-size:18px;
}

</style>

</head>

<body>

<header>
🛠️ Admin Mundial 2026
</header>

<div class="container">

>

<br><br>

<input

  type="password"

>
Ingresar

</div>

<div
  id="panelAdmin"
  class="hidden"
>

<!-- GRUPOS -->

<div class="card">

<h2>⚽ Resultados Grupos A-L</h2>

<div class="grupo-header">

<button
  class="nav-btn"
  onclick="grupoAnterior()"
>
<
</button>

<h2 id="grupoTitulo">
Grupo A
</h2>

<button
  class="nav-btn"
  onclick="grupoSiguiente()"
>
>
</button>

</div>

<div id="partidos"></div>

<button
  class="btn-guardar"
  onclick="guardarResultadosGrupo()"
>
💾 Guardar Resultados Grupo
</button>

⚡ Actualizar Ranking

<select id="faseFinal">

<option value="OCTAVOS">
OCTAVOS
</option>

<option value="CUARTOS">
CUARTOS
</option>

<option value="SEMIFINAL">
SEMIFINAL
</option>

FINAL
</option>

</select>

<input
  id="equipoLocalFinal"
  placeholder="Equipo local"
>

<input
  id="equipoVisitanteFinal"
  placeholder="Equipo visitante"
>

</div>

<button
  class="btn-final"
  onclick="crearPartidoFinal()"
>
➕ Crear Partido
</button>

</div>

<!-- VER FASE -->

<div class="card">

<h2>🏆 Ver Fase Final</h2>

<select
  id="verFase"
  onchange="cargarPartidosFinales()"
>

<option value="OCTAVOS">
OCTAVOS
</option>

<option value="CUARTOS">
CUARTOS
</option>

<option value="SEMIFINAL">
SEMIFINAL
</option>

<option value="FINAL">
FINAL
</option>

</select>

<div id="partidosFinales"></div>

<button
  class="btn-final"
  onclick="guardarResultadosFinales()"
>
💾 Guardar Resultados Finales
</button>

<h2>🏆 Ranking Actual</h2>

<table class="tabla-ranking">

<tr>
<th>#</th>

</thead>

</table>

<!-- EMERGENCIA -->

<div class="card">

<h2>🚨 Emergencia</h2>

  class="btn-danger"

🧨 Borrar TODO el Mundial

  class="btn-danger"

📊 Borrar Ranking

</button>

  class="btn-danger"
  onclick="borrarResultados()"

⚽ Borrar Resultados
</button>

  class="btn-danger"
  onclick="borrarFasesFinales()"
>
🏆 Borrar Fases Finales
</button>

<hr>

<input
  id="usuarioEliminar"
  placeholder="Usuario a eliminar"
>

<button
  class="btn-danger"
  onclick="borrarUsuario()"
>
❌ Borrar Usuario
</button>

<script src="partidos.js"></script>

<script>

/* =========================================
   VARIABLES
========================================= */

const grupos = [
  'A','B','C','D','E','F',
  'G','H','I','J','K','L'
];

let indiceGrupo = 0;

/* =========================================
   LOGIN
========================================= */

function loginAdmin(){

  const user =
    document.getElementById(
      'adminUser'
    ).value;

  const pass =
    document.getElementById(
      'adminPass'
    ).value;

  if(
    user === 'admin' &&
    pass === '1234'
  ){

    document.getElementById(
      'loginCard'
    ).classList.add('hidden');

    document.getElementById(
      'panelAdmin'
    ).classList.remove('hidden');

    renderPartidos();

    cargarRankingTabla();

    cargarPartidosFinales();

  }else{

    alert(
      '❌ Acceso incorrecto'
    );

  }

}

/* =========================================
   RENDER GRUPOS
========================================= */

function renderPartidos(){

  const grupoActual =
    grupos[indiceGrupo];

  document.getElementById(
    'grupoTitulo'
  ).innerHTML =
    `Grupo ${grupoActual}`;

  let html = '';

  let jornadaActual = '';

  const partidosGrupo =
    partidos.filter(
      p => p.grupo === grupoActual
    );

  partidosGrupo.forEach((p)=>{

    if(
      jornadaActual !== p.jornada
    ){

      jornadaActual = p.jornada;

      html += `

      <div class="jornada">
        Jornada ${p.jornada}
      </div>

      `;

    }

    html += `

    <div class="partido">

      <div class="team">
        ${p.local}
      </div>

      <input
        type="number"
        id="gl${p.id}"
        value="0"
      >

      <input
        type="number"
        id="gv${p.id}"
        value="0"
      >

     <div class="team">
      ${p.visitante}
     </div>

     <label style="display:flex;align-items:center;gap:5px;">
     <input
     type="checkbox"
     id="fin${p.id}"
    >
    Finalizado
    </label>

    </div>

    `;

  });

  document.getElementById(
    'partidos'
  ).innerHTML = html;

  cargarResultadosGrupo();

}

/* =========================================
   NAVEGACION
========================================= */

function grupoSiguiente(){

  if(
    indiceGrupo <
    grupos.length - 1
  ){

    indiceGrupo++;

    renderPartidos();

  }

}

function grupoAnterior(){

  if(indiceGrupo > 0){

    indiceGrupo--;

    renderPartidos();

  }

}

/* =========================================
   GUARDAR RESULTADOS
========================================= */

async function guardarResultadosGrupo(){

  const grupoActual =
    grupos[indiceGrupo];

  const partidosGrupo =
    partidos.filter(
      p => p.grupo === grupoActual
    );

  let data = [];

  partidosGrupo.forEach((p)=>{

    const finalizado =
      document.getElementById(
        `fin${p.id}`
      )?.checked || false;

    data.push({

      partidoId:p.id,
      local:p.local,
      visitante:p.visitante,

      golesLocal:parseInt(
        document.getElementById(
          `gl${p.id}`
        ).value
      ),

      golesVisitante:parseInt(
        document.getElementById(
          `gv${p.id}`
        ).value
      ),

      finalizado

    });

  });

  await firebaseSet(

    firebaseRef(
      db,
      `resultados/${grupoActual}`
    ),

    data

  );

  alert(
    '🔥 Resultados guardados'
  );

}

async function cargarResultadosGrupo(){

  const grupoActual =
    grupos[indiceGrupo];

  const res = await fetch(
    `https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/resultados/${grupoActual}.json`
  );

  const data = await res.json();

  if(!data) return;

  data.forEach((p)=>{

    const gl = document.getElementById(`gl${p.partidoId}`);
    const gv = document.getElementById(`gv${p.partidoId}`);

    if(gl && gv){

      gl.value = p.golesLocal;
      gv.value = p.golesVisitante;

      const fin =
        document.getElementById(`fin${p.partidoId}`);

      if(fin){
        fin.checked = p.finalizado === true;
      }

    }

  });

}

/* =========================================
   CREAR PARTIDOS FINALES
========================================= */

async function crearPartidoFinal(){

  const fase =
    document.getElementById(
      'faseFinal'
    ).value;

  const local =
    document.getElementById(
      'equipoLocalFinal'
    ).value;

  const visitante =
    document.getElementById(
      'equipoVisitanteFinal'
    ).value;

  if(
    !local ||
    !visitante
  ){

    alert(
      'Completa equipos'
    );

    return;

  }

  const id =
    Date.now();

  await firebaseSet(

    firebaseRef(
      db,
      `fasesFinales/${fase}/${id}`
    ),

    {

      id,
      fase,
      local,
      visitante,
      golesLocal:0,
      golesVisitante:0

    }

  );

  document.getElementById(
    'equipoLocalFinal'
  ).value = '';

  document.getElementById(
    'equipoVisitanteFinal'
  ).value = '';

  cargarPartidosFinales();

  alert(
    '🔥 Partido creado'
  );

}

/* =========================================
   CARGAR PARTIDOS FINALES
========================================= */

async function cargarPartidosFinales(){

  const fase =
    document.getElementById(
      'verFase'
    ).value;

  const res = await fetch(

    `https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/fasesFinales/${fase}.json`

  );

  const data =
    await res.json();

  if(!data){

    document.getElementById(
      'partidosFinales'
    ).innerHTML =
      'Sin partidos creados';

    return;

  }

  let html = `

  <div class="fase-label">
    🏆 ${fase}
  </div>

  `;

  Object.values(data).forEach((p)=>{

    html += `

    <div class="partido">

      <div class="team">
        ${p.local}
      </div>

      <input
        type="number"
        id="fgl${p.id}"
        value="${p.golesLocal}"
      >

      <input
        type="number"
        id="fgv${p.id}"
        value="${p.golesVisitante}"
      >

      <div class="team">
        ${p.visitante}
      </div>

    </div>

    `;

  });

  document.getElementById(
    'partidosFinales'
  ).innerHTML = html;

}

/* =========================================
   GUARDAR FINALES
========================================= */

async function guardarResultadosFinales(){

  const fase =
    document.getElementById(
      'verFase'
    ).value;

  const res = await fetch(

    `https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/fasesFinales/${fase}.json`

  );

  const data =
    await res.json();

  if(!data) return;

  for(const key in data){

    data[key].golesLocal =
      parseInt(
        document.getElementById(
          `fgl${data[key].id}`
        ).value
      );

    data[key].golesVisitante =
      parseInt(
        document.getElementById(
          `fgv${data[key].id}`
        ).value
      );

    await firebaseSet(

      firebaseRef(
        db,
        `fasesFinales/${fase}/${key}`
      ),

      data[key]

    );

  }

  alert(
    '🔥 Resultados finales guardados'
  );

}

/* =========================================
   CALCULAR PUNTOS
========================================= */


async function calcularPuntos(){

  const resResultados =
    await fetch(
      'https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/resultados.json'
    );

  const resultados =
    await resResultados.json();

  const resQuinielas =
    await fetch(
      'https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/quinielas.json'
    );

  const quinielas =
    await resQuinielas.json();

  if(!quinielas){

    alert('No hay quinielas');
    return;

  }

  for(const usuario in quinielas){

    let puntos = 0;
    let exactos = 0;

    const gruposUsuario =
      quinielas[usuario].grupos || {};

    for(const grupo in gruposUsuario){

      const pronosticos =
        gruposUsuario[grupo].pronosticos || [];

      const resultadosGrupo =
        resultados?.[grupo];

      if(!resultadosGrupo) continue;

      pronosticos.forEach((p)=>{

        const real =
          resultadosGrupo.find(
            r =>
              Number(r.partidoId) ===
              Number(p.partidoId)
          );

        if(!real) return;

        if(real.finalizado !== true) return;

        if(
          p.golesLocal === real.golesLocal &&
          p.golesVisitante === real.golesVisitante
        ){
          puntos += 2;
          exactos++;
          return;
        }

        const pronostico =
          p.golesLocal > p.golesVisitante
          ? 'L'
          : p.golesLocal < p.golesVisitante
          ? 'V'
          : 'E';

        const realResultado =
          real.golesLocal > real.golesVisitante
          ? 'L'
          : real.golesLocal < real.golesVisitante
          ? 'V'
          : 'E';

        if(pronostico === realResultado){
          puntos += 1;
        }

      });

    }

    const fases = [
      'OCTAVOS',
      'CUARTOS',
      'SEMIFINAL',
      'FINAL'
    ];

    const fasesUsuario =
      quinielas[usuario].fasesFinales || {};

    for(const fase of fases){

      const pronosticos =
        fasesUsuario[fase]?.pronosticos || [];

      const resFase =
        await fetch(
          `https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/fasesFinales/${fase}.json`
        );

      const resultadosFase =
        await resFase.json();

      if(!resultadosFase) continue;

      pronosticos.forEach((p)=>{

        const real =
          Object.values(resultadosFase).find(
            r =>
              Number(r.id) ===
              Number(p.partidoId)
          );

        if(!real) return;

        if(
          p.golesLocal === real.golesLocal &&
          p.golesVisitante === real.golesVisitante
        ){
          puntos += 2;
          exactos++;
          return;
        }

        const pronostico =
          p.golesLocal > p.golesVisitante
          ? 'L'
          : p.golesLocal < p.golesVisitante
          ? 'V'
          : 'E';

        const realResultado =
          real.golesLocal > real.golesVisitante
          ? 'L'
          : real.golesLocal < real.golesVisitante
          ? 'V'
          : 'E';

        if(pronostico === realResultado){
          puntos += 1;
        }

      });

    }

    await firebaseSet(
      firebaseRef(
        db,
        `ranking/${usuario}`
      ),
      {
        usuario,
        puntos,
        exactos
      }
    );

  }

  cargarRankingTabla();

  alert('🔥 Ranking actualizado');

}


/* =========================================
   CARGAR RANKING
========================================= */

async function cargarRankingTabla(){

  const res =
    await fetch(
      'https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/ranking.json'
    );

  const data =
    await res.json();

  if(!data) return;

  const ranking =
    Object.values(data);

  ranking.sort((a,b)=>{

    if(
      b.puntos !==
      a.puntos
    ){

      return (
        b.puntos -
        a.puntos
      );

    }

    return (
      b.exactos -
      a.exactos
    );

  });

  let html = '';

  ranking.forEach((r,i)=>{

    html += `

    <tr>

      <td>${i+1}</td>

      <td>${r.usuario}</td>

      <td>${r.puntos}</td>

      <td>${r.exactos}</td>

    </tr>

    `;

  });

  document.getElementById(
    'tablaRanking'
  ).innerHTML = html;

}

/* =========================================
   EMERGENCIA
========================================= */

async function borrarTodoMundial(){

  const confirmacion =
    prompt(
      '⚠️ Escribe BORRAR'
    );

  if(
    confirmacion !==
    'BORRAR'
  ){

    return;

  }

  await firebaseSet(
    firebaseRef(db,'resultados'),
    null
  );

  await firebaseSet(
    firebaseRef(db,'quinielas'),
    null
  );

  await firebaseSet(
    firebaseRef(db,'ranking'),
    null
  );

  await firebaseSet(
    firebaseRef(db,'fasesFinales'),
    null
  );

  alert(
    '🔥 Mundial reiniciado'
  );

  location.reload();

}

async function borrarRanking(){

  await firebaseSet(
    firebaseRef(db,'ranking'),
    null
  );

  alert(
    '🔥 Ranking eliminado'
  );

}

async function borrarQuinielas(){

  await firebaseSet(
    firebaseRef(db,'quinielas'),
    null
  );

  alert(
    '🔥 Quinielas eliminadas'
  );

}

async function borrarResultados(){

  await firebaseSet(
    firebaseRef(db,'resultados'),
    null
  );

  alert(
    '🔥 Resultados eliminados'
  );

}

async function borrarFasesFinales(){

  await firebaseSet(
    firebaseRef(db,'fasesFinales'),
    null
  );

  alert(
    '🔥 Fases eliminadas'
  );

}

async function borrarUsuario(){

  const usuario =
    document.getElementById(
      'usuarioEliminar'
    ).value;

  if(!usuario){

    alert(
      'Escribe usuario'
    );

    return;

  }

  await firebaseSet(
    firebaseRef(
      db,
      `quinielas/${usuario}`
    ),
    null
  );

  await firebaseSet(
    firebaseRef(
      db,
      `ranking/${usuario}`
    ),
    null
  );

  alert(
    `🔥 ${usuario} eliminado`
  );

}

</script>
