<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Quiniela Mundial 2026</title>

<style>

body{
  font-family:Arial;
  background:#eef2f7;
  margin:0;
}

header{
  background:#7f1d1d;
  color:white;
  text-align:center;
  padding:18px;
  font-size:24px;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

h2{
  margin-top:0;
  color:#7f1d1d;
}

.grupo{
  margin-bottom:25px;
}

.partido{
  display:grid;
  grid-template-columns:1fr 70px 70px 1fr;
  gap:10px;
  align-items:center;
  margin-bottom:10px;
}

.team{
  text-align:center;
  font-weight:bold;
}

input{
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  text-align:center;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
}

.btn-guardar{
  background:#1d4ed8;
}

.btn-ranking{
  background:#15803d;
}

.btn-reset{
  background:#dc2626;
}

.btn-user{
  background:#ea580c;
}

button:hover{
  opacity:.9;
}

.admin-tools{
  display:grid;
  gap:15px;
}

</style>

</head>

<body>

<header>
🛠️ Admin Mundial 2026
</header>

<div class="container">

<!-- RESULTADOS -->

<div class="card">

<h2>⚽ Captura Resultados</h2>

<div id="resultados"></div>

<button
  class="btn-guardar"
  onclick="guardarResultados()"
>
💾 Guardar Resultados
</button>

<button
  class="btn-ranking"
  onclick="calcularPuntos()"
>
⚡ Calcular Ranking
</button>

</div>

<!-- HERRAMIENTAS -->

<div class="card">

<h2>🧨 Herramientas Admin</h2>

<div class="admin-tools">

<input
  id="usuarioEliminar"
  placeholder="Nombre usuario a eliminar"
/>

<button
  class="btn-user"
  onclick="eliminarUsuario()"
>
❌ Eliminar Usuario
</button>

<button
  class="btn-reset"
  onclick="resetRanking()"
>
🏆 Reiniciar Ranking
</button>

<button
  class="btn-reset"
  onclick="resetMundial()"
>
🧨 Reiniciar Mundial Completo
</button>

</div>

</div>

</div>

<script src="partidos.js"></script>

<script>

/* =========================================
   RENDER RESULTADOS
========================================= */

const grupos = [
  "A","B","C","D","E","F",
  "G","H","I","J","K","L"
];

function renderResultados(){

  let html = "";

  grupos.forEach((grupo)=>{

    html += `

    <div class="grupo">

      <h3>Grupo ${grupo}</h3>

    `;

    const partidosGrupo =
      partidos.filter(
        p => p.grupo === grupo
      );

    partidosGrupo.forEach((p)=>{

      html += `

      <div class="partido">

        <div class="team">
          ${p.local}
        </div>

        <input
          type="number"
          id="gl${p.id}"
          min="0"
          value="0"
        >

        <input
          type="number"
          id="gv${p.id}"
          min="0"
          value="0"
        >

        <div class="team">
          ${p.visitante}
        </div>

      </div>

      `;

    });

    html += `</div>`;

  });

  document.getElementById(
    "resultados"
  ).innerHTML = html;

}

/* =========================================
   GUARDAR RESULTADOS
========================================= */

async function guardarResultados(){

  try{

    let data = {};

    grupos.forEach((grupo)=>{

      const partidosGrupo =
        partidos.filter(
          p => p.grupo === grupo
        );

      data[grupo] = [];

      partidosGrupo.forEach((p)=>{

        const gl =
          document.getElementById(
            `gl${p.id}`
          ).value;

        const gv =
          document.getElementById(
            `gv${p.id}`
          ).value;

        data[grupo].push({

          partidoId:p.id,

          golesLocal:
            parseInt(gl),

          golesVisitante:
            parseInt(gv)

        });

      });

    });

    await firebaseSet(

      firebaseRef(
        db,
        "resultados"
      ),

      data

    );

    alert(
      "🔥 Resultados guardados"
    );

  }catch(e){

    console.error(e);

    alert(
      "❌ Error guardando"
    );

  }

}

/* =========================================
   CALCULAR PUNTOS
========================================= */

async function calcularPuntos(){

  try{

    const resResultados =
      await fetch(

        "https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/resultados.json"

      );

    const resultados =
      await resResultados.json();

    const resQuinielas =
      await fetch(

        "https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/quinielas.json"

      );

    const quinielas =
      await resQuinielas.json();

    if(!quinielas || !resultados){

      alert(
        "❌ Faltan datos"
      );

      return;

    }

    for(const usuario in quinielas){

      let puntos = 0;

      let exactos = 0;

      const gruposUsuario =
        quinielas[usuario].grupos || {};

      for(const grupo in gruposUsuario){

        const pronosticos =
          gruposUsuario[grupo].pronosticos || [];

        const resultadosGrupo =
          resultados[grupo];

        if(!resultadosGrupo){

          continue;

        }

        pronosticos.forEach((p)=>{

          const real =
            resultadosGrupo.find(

              r =>

                Number(r.partidoId) ===
                Number(p.partidoId)

            );

          if(!real) return;

          if(

            p.golesLocal === real.golesLocal &&

            p.golesVisitante === real.golesVisitante

          ){

            exactos++;

          }

          const resultadoPronostico =

            p.golesLocal > p.golesVisitante
            ? "L"

            : p.golesLocal < p.golesVisitante
            ? "V"

            : "E";

          const resultadoReal =

            real.golesLocal > real.golesVisitante
            ? "L"

            : real.golesLocal < real.golesVisitante
            ? "V"

            : "E";

          if(
            resultadoPronostico === resultadoReal
          ){

            puntos++;

          }

        });

      }

      await firebaseSet(

        firebaseRef(
          db,
          `ranking/${usuario}`
        ),

        {

          usuario,

          puntos,

          exactos

        }

      );

    }

    alert(
      "🔥 Ranking calculado"
    );

  }catch(e){

    console.error(e);

    alert(
      "❌ Error calculando"
    );

  }

}

/* =========================================
   ELIMINAR USUARIO
========================================= */

async function eliminarUsuario(){

  const usuario =
    document.getElementById(
      "usuarioEliminar"
    ).value;

  if(!usuario){

    alert(
      "Escribe usuario"
    );

    return;

  }

  const ok =
    confirm(

      `¿Eliminar completamente a ${usuario}?`

    );

  if(!ok) return;

  try{

    await firebaseRemove(

      firebaseRef(
        db,
        `quinielas/${usuario}`
      )

    );

    await firebaseRemove(

      firebaseRef(
        db,
        `ranking/${usuario}`
      )

    );

    alert(
      `🔥 Usuario ${usuario} eliminado`
    );

  }catch(e){

    console.error(e);

    alert(
      "❌ Error eliminando usuario"
    );

  }

}

/* =========================================
   RESET RANKING
========================================= */

async function resetRanking(){

  const ok =
    confirm(

      "¿Eliminar TODO el ranking?"

    );

  if(!ok) return;

  try{

    await firebaseRemove(

      firebaseRef(
        db,
        "ranking"
      )

    );

    alert(
      "🔥 Ranking reiniciado"
    );

  }catch(e){

    console.error(e);

    alert(
      "❌ Error reset ranking"
    );

  }

}

/* =========================================
   RESET MUNDIAL
========================================= */

async function resetMundial(){

  const ok =
    confirm(

      "⚠️ ESTO BORRARÁ TODO EL MUNDIAL ¿Continuar?"

    );

  if(!ok) return;

  try{

    await firebaseRemove(

      firebaseRef(
        db,
        "quinielas"
      )

    );

    await firebaseRemove(

      firebaseRef(
        db,
        "ranking"
      )

    );

    await firebaseRemove(

      firebaseRef(
        db,
        "resultados"
      )

    );

    alert(
      "🔥 Mundial reiniciado"
    );

  }catch(e){

    console.error(e);

    alert(
      "❌ Error reiniciando"
    );

  }

}

/* =========================================
   INIT
========================================= */

renderResultados();

</script>

</body>

</html>
