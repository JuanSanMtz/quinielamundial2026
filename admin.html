<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Quiniela Mundial 2026</title>

<style>

body{
  font-family:Arial;
  background:#eef2f7;
  margin:0;
}

header{
  background:#1e3c72;
  color:white;
  text-align:center;
  padding:18px;
  font-size:24px;
  font-weight:bold;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

input{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  margin-bottom:10px;
  box-sizing:border-box;
}

button.guardar{
  width:100%;
  padding:14px;
  margin-top:10px;
  background:#1e3c72;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

button.guardar:hover{
  background:#294f96;
}

.grupo-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.grupo-title{
  font-size:24px;
  font-weight:bold;
  color:#1e3c72;
}

.nav-btn{
  width:45px;
  height:45px;
  border:none;
  border-radius:50%;
  background:#1e3c72;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.jornada{
  background:#dfe7f5;
  padding:10px;
  border-radius:8px;
  margin-top:15px;
  margin-bottom:10px;
  font-weight:bold;
}

.partido{
  display:grid;
  grid-template-columns:1fr 60px 60px 1fr;
  gap:10px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.team{
  text-align:center;
  font-weight:bold;
  font-size:14px;
}

.marcador{
  text-align:center;
}

.info{
  background:#fff4d6;
  border:1px solid #ffe08a;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
}

.indicadores{
  text-align:center;
  margin-top:15px;
}

.dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ccc;
  margin:4px;
}

.dot.active{
  background:#1e3c72;
}

.admin-ok{
  background:#dcfce7;
  color:#166534;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  text-align:center;
  font-weight:bold;
}

</style>

</head>

<body>

<header>
🔐 Admin Quiniela Mundial 2026
</header>

<div class="container">

<!-- LOGIN -->

<div
  class="card"
  id="loginCard"
>

<h2>🔐 Acceso Admin</h2>

<input
  id="user"
  placeholder="Usuario"
>

<input
  id="pass"
  type="password"
  placeholder="Contraseña"
>

<button
  class="guardar"
  onclick="login()"
>
Entrar
</button>

</div>

<!-- PANEL -->

<div
  id="panelAdmin"
  style="display:none;"
>

<div
  id="estadoAdmin"
></div>

<!-- RESULTADOS -->

<div class="card">

<div class="info">
🏆 Captura resultados oficiales y calcula ranking.
</div>

<div class="grupo-header">

<button
  class="nav-btn"
  onclick="grupoAnterior()"
>
<
</button>

<div
  class="grupo-title"
  id="grupoTitulo"
>
Grupo A
</div>

<button
  class="nav-btn"
  onclick="grupoSiguiente()"
>
>
</button>

</div>

<div id="partidos"></div>

<div
  class="indicadores"
  id="indicadores"
></div>

<button
  class="guardar"
  onclick="guardarResultados()"
>
💾 Guardar Resultados
</button>

<button
  class="guardar"
  style="background:#2e7d32;"
  onclick="calcularPuntos()"
>
⚡ Calcular Ranking
</button>

</div>

<!-- RESET -->

<div class="card">

<button
  class="guardar"
  style="background:#c62828;"
  onclick="resetearDB()"
>
🗑️ Reiniciar Quiniela
</button>

</div>

</div>

</div>

<script src="partidos.js"></script>

<script>

/* =========================================
   LOGIN
========================================= */

function login(){

  const u =
    document.getElementById("user").value;

  const p =
    document.getElementById("pass").value;

  if(
    u === "admin" &&
    p === "1234"
  ){

    document.getElementById(
      "loginCard"
    ).style.display = "none";

    document.getElementById(
      "panelAdmin"
    ).style.display = "block";

    renderPartidos();

  }else{

    alert(
      "❌ Credenciales incorrectas"
    );

  }

}

/* =========================================
   VARIABLES
========================================= */

const grupos = [
  "A","B","C","D","E","F",
  "G","H","I","J","K","L"
];

let indiceGrupo = 0;

/* =========================================
   RENDER PARTIDOS
========================================= */

async function renderPartidos(){

  const grupoActual =
    grupos[indiceGrupo];

  document.getElementById(
    "grupoTitulo"
  ).innerHTML =
    `Grupo ${grupoActual}`;

  let html = "";

  let jornadaActual = "";

  const partidosGrupo =
    partidos.filter(
      p => p.grupo === grupoActual
    );

  partidosGrupo.forEach((p)=>{

    if(jornadaActual !== p.jornada){

      jornadaActual = p.jornada;

      html += `

      <div class="jornada">
        Jornada ${jornadaActual}
      </div>

      `;

    }

    html += `

    <div class="partido">

      <div class="team">
        ${p.local}
      </div>

      <input
        type="number"
        class="marcador"
        id="gl${p.id}"
        min="0"
      >

      <input
        type="number"
        class="marcador"
        id="gv${p.id}"
        min="0"
      >

      <div class="team">
        ${p.visitante}
      </div>

    </div>

    `;

  });

  document.getElementById(
    "partidos"
  ).innerHTML = html;

  renderIndicadores();

  cargarResultadosGuardados();

}

/* =========================================
   CARGAR RESULTADOS
========================================= */

async function cargarResultadosGuardados(){

  const grupoActual =
    grupos[indiceGrupo];

  try{

    const res =
      await fetch(

        `https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/resultados/${grupoActual}.json`

      );

    const data =
      await res.json();

    if(!data) return;

    data.forEach((p)=>{

      const gl =
        document.getElementById(
          `gl${p.partidoId}`
        );

      const gv =
        document.getElementById(
          `gv${p.partidoId}`
        );

      if(gl && gv){

        gl.value =
          p.golesLocal;

        gv.value =
          p.golesVisitante;

      }

    });

  }catch(e){

    console.error(e);

  }

}

/* =========================================
   INDICADORES
========================================= */

function renderIndicadores(){

  let html = "";

  grupos.forEach((g,i)=>{

    html += `

    <span class="
      dot
      ${i === indiceGrupo ? 'active' : ''}
    "></span>

    `;

  });

  document.getElementById(
    "indicadores"
  ).innerHTML = html;

}

/* =========================================
   NAVEGACIÓN
========================================= */

function grupoSiguiente(){

  if(indiceGrupo < grupos.length - 1){

    indiceGrupo++;

    renderPartidos();

  }

}

function grupoAnterior(){

  if(indiceGrupo > 0){

    indiceGrupo--;

    renderPartidos();

  }

}

/* =========================================
   GUARDAR RESULTADOS
========================================= */

async function guardarResultados(){

  const grupoActual =
    grupos[indiceGrupo];

  const partidosGrupo =
    partidos.filter(
      p => p.grupo === grupoActual
    );

  let resultados = [];

  let incompleto = false;

  partidosGrupo.forEach((p)=>{

    const gl =
      document.getElementById(
        `gl${p.id}`
      );

    const gv =
      document.getElementById(
        `gv${p.id}`
      );

    if(!gl || !gv) return;

    if(
      gl.value === "" ||
      gv.value === ""
    ){

      incompleto = true;

      return;

    }

    resultados.push({

      partidoId:p.id,

      grupo:p.grupo,

      local:p.local,

      visitante:p.visitante,

      golesLocal:
        parseInt(gl.value),

      golesVisitante:
        parseInt(gv.value)

    });

  });

  if(incompleto){

    alert(
      "Completa todos los partidos"
    );

    return;

  }

  try{

    await firebaseSet(

      firebaseRef(
        db,
        `resultados/${grupoActual}`
      ),

      resultados

    );

    document.getElementById(
      "estadoAdmin"
    ).innerHTML = `

    <div class="admin-ok">
      ✅ Resultados Grupo ${grupoActual} guardados
    </div>

    `;

    alert(
      "🔥 Resultados guardados"
    );

  }catch(e){

    console.error(e);

    alert(
      "❌ Error guardando"
    );

  }

}

/* =========================================
   CALCULAR RANKING
========================================= */

async function calcularPuntos(){

  try{

    const resResultados =
      await fetch(

        "https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/resultados.json"

      );

    const resultados =
      await resResultados.json();

    const resQuinielas =
      await fetch(

        "https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/quinielas.json"

      );

    const quinielas =
      await resQuinielas.json();

    if(!quinielas || !resultados){

      alert(
        "❌ Faltan datos"
      );

      return;

    }

    for(const usuario in quinielas){

      let puntos = 0;

      let exactos = 0;

      const gruposUsuario =
        quinielas[usuario].grupos || {};

      for(const grupo in gruposUsuario){

        const pronosticos =
          gruposUsuario[grupo].pronosticos || [];

        const resultadosGrupo =
          resultados[grupo] || [];

        pronosticos.forEach((p)=>{

          const real =
            resultadosGrupo.find(
              r => r.partidoId === p.partidoId
            );

          if(!real) return;

          /* =========================
             MARCADOR EXACTO
          ========================= */

          if(

            p.golesLocal === real.golesLocal &&

            p.golesVisitante === real.golesVisitante

          ){

            exactos++;

          }

          /* =========================
             GANADOR / EMPATE
          ========================= */

          const resultadoPronostico =

            p.golesLocal > p.golesVisitante
            ? "L"

            : p.golesLocal < p.golesVisitante
            ? "V"

            : "E";

          const resultadoReal =

            real.golesLocal > real.golesVisitante
            ? "L"

            : real.golesLocal < real.golesVisitante
            ? "V"

            : "E";

          if(
            resultadoPronostico === resultadoReal
          ){

            puntos++;

          }

        });

      }

      await firebaseSet(

        firebaseRef(
          db,
          `ranking/${usuario}`
        ),

        {

          usuario,

          puntos,

          exactos

        }

      );

    }

    alert(
      "🔥 Ranking calculado"
    );

  }catch(e){

    console.error(e);

    alert(
      "❌ Error calculando"
    );

  }

}

/* =========================================
   RESET
========================================= */

async function resetearDB(){

  const ok = confirm(
    "⚠️ ¿Borrar toda la quiniela?"
  );

  if(!ok) return;

  try{

    await firebaseSet(
      firebaseRef(db,"quinielas"),
      null
    );

    await firebaseSet(
      firebaseRef(db,"resultados"),
      null
    );

    await firebaseSet(
      firebaseRef(db,"ranking"),
      null
    );

    alert(
      "🔥 Quiniela reiniciada"
    );

    location.reload();

  }catch(e){

    console.error(e);

  }

}

/* =========================================
   INIT
========================================= */

renderIndicadores();

</script>
