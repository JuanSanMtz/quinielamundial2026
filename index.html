<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiniela Mundial 2026</title>

<style>

body{
  font-family:Arial;
  background:#eef2f7;
  margin:0;
}

header{
  background:#1e3c72;
  color:white;
  text-align:center;
  padding:18px;
  font-size:24px;
  font-weight:bold;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

input{
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

#usuario{
  width:100%;
}

.grupo-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.grupo-title{
  font-size:24px;
  font-weight:bold;
  color:#1e3c72;
}

.nav-btn{
  width:45px;
  height:45px;
  border:none;
  border-radius:50%;
  background:#1e3c72;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.nav-btn:hover{
  background:#294f96;
}

.jornada{
  background:#dfe7f5;
  padding:10px;
  border-radius:8px;
  margin-top:15px;
  margin-bottom:10px;
  font-weight:bold;
}

.partido{
  display:grid;
  grid-template-columns:1fr 60px 60px 1fr;
  gap:10px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.team{
  text-align:center;
  font-weight:bold;
  font-size:14px;
}

.marcador{
  width:100%;
  text-align:center;
  font-size:16px;
}

button.guardar{
  width:100%;
  padding:14px;
  margin-top:20px;
  background:#1e3c72;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

button.guardar:hover{
  background:#294f96;
}

.ranking-item{
  display:flex;
  justify-content:space-between;
  padding:12px;
  border-bottom:1px solid #eee;
}

.indicadores{
  text-align:center;
  margin-top:15px;
}

.dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ccc;
  margin:4px;
}

.dot.active{
  background:#1e3c72;
}

.grupo-bloqueado{
  margin-top:15px;
  padding:12px;
  background:#dcfce7;
  color:#166534;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
}

.panel-usuario{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:10px;
  padding:15px;
}

.panel-item{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #dbeafe;
}

.detalle-item{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.ok{
  color:#15803d;
  font-weight:bold;
}

.bad{
  color:#dc2626;
  font-weight:bold;
}

</style>

</head>

<body>

<header>
⚽ Quiniela Mundial 2026
</header>

<div class="container">

<!-- PARTICIPANTE -->

<div class="card">

<h2>👤 Participante</h2>

<input
  id="usuario"
  placeholder="Escribe tu nombre"
  oninput="
    guardarCacheUsuario();
    renderPartidos();
    cargarMiPanel();
  "
/>

</div>

<!-- PARTIDOS -->

<div class="card">

<div class="grupo-header">

<button
  class="nav-btn"
  onclick="grupoAnterior()"
>
<
</button>

<div
  class="grupo-title"
  id="grupoTitulo"
>
Grupo A
</div>

<button
  class="nav-btn"
  onclick="grupoSiguiente()"
>
>
</button>

</div>

<div id="partidos"></div>

<div id="estadoGrupo"></div>

<div
  class="indicadores"
  id="indicadores"
></div>

<button
  class="guardar"
  onclick="confirmarGuardado()"
>
💾 Guardar Grupo
</button>

</div>

<!-- RANKING -->

<div class="card">

<h2>🏆 Ranking</h2>

<div id="ranking"></div>

</div>

<!-- PANEL -->

<div class="card">

<h2>📊 Mi Quiniela</h2>

<div id="panelUsuario">

<div class="panel-usuario">

<div class="panel-item">
<div>🏆 Puntos</div>
<div>0</div>
</div>

<div class="panel-item">
<div>⭐ Exactos</div>
<div>0</div>
</div>

<div class="panel-item">
<div>📈 Posición</div>
<div>#-</div>
</div>

</div>

</div>

<div id="detalleUsuario"></div>

</div>

</div>

<script src="partidos.js"></script>

<script>

const grupos = [
  'A',
  'OCTAVOS',
  'CUARTOS',
  'SEMIFINAL',
  'FINAL'
];

let indiceGrupo = 0;

/* CACHE */

function guardarCacheUsuario(){

  localStorage.setItem(
    "usuarioQuiniela",
    document.getElementById(
      "usuario"
    ).value
  );

}

function guardarCacheGrupo(){

  const grupoActual =
    grupos[indiceGrupo];

  let datos = {};

  const partidosGrupo =
    partidos.filter(
      p => p.grupo === grupoActual
    );

  partidosGrupo.forEach((p)=>{

    const gl =
      document.getElementById(`gl${p.id}`);

    const gv =
      document.getElementById(`gv${p.id}`);

    if(!gl || !gv) return;

    datos[p.id] = {

      gl:gl.value,
      gv:gv.value

    };

  });

  localStorage.setItem(

    `cache_${grupoActual}`,

    JSON.stringify(datos)

  );

}

function recuperarCacheGrupo(){

  const grupoActual =
    grupos[indiceGrupo];

  const cache =
    localStorage.getItem(
      `cache_${grupoActual}`
    );

  if(!cache) return;

  const datos =
    JSON.parse(cache);

  Object.keys(datos).forEach((id)=>{

    const gl =
      document.getElementById(`gl${id}`);

    const gv =
      document.getElementById(`gv${id}`);

    if(gl && gv){

      gl.value =
        datos[id].gl;

      gv.value =
        datos[id].gv;

    }

  });

}

/* PANEL */

async function cargarMiPanel(){

  const usuario =
    document.getElementById(
      "usuario"
    ).value;

  if(!usuario) return;

  try{

    const resRanking =
      await fetch(
        "https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/ranking.json"
      );

    const rankingData =
      await resRanking.json();

    if(!rankingData) return;

    const ranking =
      Object.values(rankingData);

    ranking.sort((a,b)=>{

      if(b.puntos !== a.puntos){

        return b.puntos - a.puntos;

      }

      return b.exactos - a.exactos;

    });

    const usuarioRanking =
      ranking.find(
        r => r.usuario === usuario
      );

    let posicion = "-";

    ranking.forEach((r,i)=>{

      if(r.usuario === usuario){

        posicion = i + 1;

      }

    });

    if(usuarioRanking){

      document.getElementById(
        "panelUsuario"
      ).innerHTML = `

      <div class="panel-usuario">

        <div class="panel-item">
          <div>🏆 Puntos</div>
          <div>${usuarioRanking.puntos}</div>
        </div>

        <div class="panel-item">
          <div>⭐ Exactos</div>
          <div>${usuarioRanking.exactos}</div>
        </div>

        <div class="panel-item">
          <div>📈 Posición</div>
          <div>#${posicion}</div>
        </div>

      </div>

      `;

    }

  }catch(e){

    console.error(e);

  }

}

/* RENDER */

async function renderPartidos(){

  const usuario =
    document.getElementById(
      "usuario"
    ).value;

  if(!usuario){

    return;

  }

  const grupoActual =
    grupos[indiceGrupo];

  document.getElementById(
    "grupoTitulo"
  ).innerHTML =
    grupoActual;

  let html = "";

  let jornadaActual = "";

  const partidosGrupo =
    partidos.filter(
      p => p.grupo === grupoActual
    );

  partidosGrupo.forEach((p)=>{

    if(
      p.fase === "grupos"
    ){

      if(
        jornadaActual !== p.jornada
      ){

        jornadaActual = p.jornada;

        html += `

        <div class="jornada">
          Jornada ${jornadaActual}
        </div>

        `;

      }

    }

    html += `

    <div class="partido">

      <div class="team">
        ${p.local}
      </div>

      <input
        type="number"
        class="marcador"
        id="gl${p.id}"
        min="0"
        value="0"
        oninput="
          guardarCacheGrupo();
        "
      >

      <input
        type="number"
        class="marcador"
        id="gv${p.id}"
        min="0"
        value="0"
        oninput="
          guardarCacheGrupo();
        "
      >

      <div class="team">
        ${p.visitante}
      </div>

    </div>

    `;

  });

  document.getElementById(
    "partidos"
  ).innerHTML = html;

  renderIndicadores();

  recuperarCacheGrupo();

  await verificarGrupoGuardado();

}

/* INDICADORES */

function renderIndicadores(){

  let html = "";

  grupos.forEach((g,i)=>{

    html += `

    <span class="
      dot
      ${i === indiceGrupo ? 'active' : ''}
    "></span>

    `;

  });

  document.getElementById(
    "indicadores"
  ).innerHTML = html;

}

/* BLOQUEAR */

function bloquearGrupo(){

  const inputs =
    document.querySelectorAll(
      ".marcador"
    );

  inputs.forEach((i)=>{

    i.disabled = true;

    i.style.background =
      "#e5e7eb";

  });

}

/* DESBLOQUEAR */

function desbloquearGrupo(){

  const inputs =
    document.querySelectorAll(
      ".marcador"
    );

  inputs.forEach((i)=>{

    i.disabled = false;

    i.style.background =
      "white";

  });

}

/* VERIFICAR */

async function verificarGrupoGuardado(){

  desbloquearGrupo();

  document.getElementById(
    "estadoGrupo"
  ).innerHTML = "";

  const usuario =
    document.getElementById(
      "usuario"
    ).value;

  if(!usuario) return;

  const grupoActual =
    grupos[indiceGrupo];

  try{

    const res =
      await fetch(

        `https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/quinielas/${usuario}/grupos/${grupoActual}.json`

      );

    const data =
      await res.json();

    if(data){

      data.pronosticos.forEach((p)=>{

        const gl =
          document.getElementById(
            `gl${p.partidoId}`
          );

        const gv =
          document.getElementById(
            `gv${p.partidoId}`
          );

        if(gl && gv){

          gl.value =
            p.golesLocal;

          gv.value =
            p.golesVisitante;

        }

      });

      bloquearGrupo();

      document.getElementById(
        "estadoGrupo"
      ).innerHTML = `

      <div class="grupo-bloqueado">
        🔒 ${grupoActual} ya guardado
      </div>

      `;

    }

  }catch(e){

    console.error(e);

  }

}

/* NAVEGACION */

function grupoSiguiente(){

  guardarCacheGrupo();

  if(
    indiceGrupo <
    grupos.length - 1
  ){

    indiceGrupo++;

    renderPartidos();

  }

}

function grupoAnterior(){

  guardarCacheGrupo();

  if(indiceGrupo > 0){

    indiceGrupo--;

    renderPartidos();

  }

}

/* CONFIRMAR */

function confirmarGuardado(){

  const grupoActual =
    grupos[indiceGrupo];

  const ok = confirm(
    `¿Guardar ${grupoActual}?`
  );

  if(ok){

    guardarGrupo();

  }

}

/* GUARDAR */

async function guardarGrupo(){

  const usuario =
    document.getElementById(
      "usuario"
    ).value;

  if(!usuario){

    alert(
      "Ingresa tu nombre"
    );

    return;

  }

  const grupoActual =
    grupos[indiceGrupo];

  const partidosGrupo =
    partidos.filter(
      p => p.grupo === grupoActual
    );

  let pronosticos = [];

  partidosGrupo.forEach((p)=>{

    pronosticos.push({

      partidoId:p.id,

      grupo:p.grupo,

      local:p.local,

      visitante:p.visitante,

      golesLocal:parseInt(

        document.getElementById(
          `gl${p.id}`
        ).value

      ),

      golesVisitante:parseInt(

        document.getElementById(
          `gv${p.id}`
        ).value

      )

    });

  });

  await firebaseSet(

    firebaseRef(
      db,
      `quinielas/${usuario}/grupos/${grupoActual}`
    ),

    {

      fecha:
        new Date().toISOString(),

      pronosticos

    }

  );

  bloquearGrupo();

  localStorage.removeItem(
    `cache_${grupoActual}`
  );

  document.getElementById(
    "estadoGrupo"
  ).innerHTML = `

  <div class="grupo-bloqueado">
    🔒 ${grupoActual} guardado
  </div>

  `;

  cargarRanking();

  cargarMiPanel();

  alert(
    `🔥 ${grupoActual} guardado`
  );

}

/* RANKING */

async function cargarRanking(){

  try{

    const res =
      await fetch(
        "https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/ranking.json"
      );

    const data =
      await res.json();

    let html = "";

    if(!data){

      html = `

      <div class="ranking-item">
        Sin ranking todavía
      </div>

      `;

    }else{

      const ranking =
        Object.values(data);

      ranking.sort((a,b)=>{

        if(
          b.puntos !==
          a.puntos
        ){

          return (
            b.puntos -
            a.puntos
          );

        }

        return (
          b.exactos -
          a.exactos
        );

      });

      ranking.forEach((r,i)=>{

        let emoji = "🏅";

        if(i === 0) emoji = "🥇";
        if(i === 1) emoji = "🥈";
        if(i === 2) emoji = "🥉";

        html += `

        <div class="ranking-item">

          <div>
            ${emoji} ${r.usuario}
          </div>

          <div>
            ${r.puntos} pts
            ⭐ ${r.exactos}
          </div>

        </div>

        `;

      });

    }

    document.getElementById(
      "ranking"
    ).innerHTML = html;

  }catch(e){

    console.error(e);

  }

}

/* INIT */

window.onload = ()=>{

  const usuario =
    localStorage.getItem(
      "usuarioQuiniela"
    );

  if(usuario){

    document.getElementById(
      "usuario"
    ).value = usuario;

    renderPartidos();

    cargarMiPanel();

  }

  cargarRanking();

};

</script>

</body>
