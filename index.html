<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiniela Mundial 2026</title>

<style>

body{
  font-family:Arial;
  background:#eef2f7;
  margin:0;
}

header{
  background:#1e3c72;
  color:white;
  text-align:center;
  padding:18px;
  font-size:24px;
  font-weight:bold;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

input{
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

#usuario{
  width:100%;
}

.grupo-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.grupo-title{
  font-size:24px;
  font-weight:bold;
  color:#1e3c72;
}

.nav-btn{
  width:45px;
  height:45px;
  border:none;
  border-radius:50%;
  background:#1e3c72;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.jornada{
  background:#dfe7f5;
  padding:10px;
  border-radius:8px;
  margin-top:15px;
  margin-bottom:10px;
  font-weight:bold;
}

.partido{
  display:grid;
  grid-template-columns:1fr 60px 60px 1fr;
  gap:10px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.team{
  text-align:center;
  font-weight:bold;
  font-size:14px;
}

.marcador{
  width:100%;
  text-align:center;
  font-size:16px;
}

button.guardar{
  width:100%;
  padding:14px;
  margin-top:20px;
  background:#1e3c72;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

.ranking-item{
  display:flex;
  justify-content:space-between;
  padding:12px;
  border-bottom:1px solid #eee;
}

.indicadores{
  text-align:center;
  margin-top:15px;
}

.dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ccc;
  margin:4px;
}

.dot.active{
  background:#1e3c72;
}

.grupo-bloqueado{
  margin-top:15px;
  padding:12px;
  background:#dcfce7;
  color:#166534;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
}

.panel-usuario{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:10px;
  padding:15px;
}

.panel-item{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #dbeafe;
}

.fase-label{
  background:#ede9fe;
  padding:10px;
  border-radius:8px;
  margin-top:15px;
  margin-bottom:10px;
  font-weight:bold;
  color:#5b21b6;
}

.tabla-resultados{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

.tabla-resultados th,
.tabla-resultados td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
  font-size:14px;
}

.tabla-resultados th{
  background:#1e3c72;
  color:white;
}

.acierto{
  background:#dcfce7;
  color:#166534;
  font-weight:bold;
}

.fallo{
  background:#fee2e2;
  color:#991b1b;
  font-weight:bold;
}

.parcial{
  background:#fef9c3;
  color:#854d0e;
  font-weight:bold;
}

</style>

</head>

<body>

<header>
⚽ Quiniela Mundial 2026
</header>

<div class="container">

<!-- PARTICIPANTE -->

<div class="card">

<h2>👤 Participante</h2>

<input
  id="usuario"
  placeholder="Escribe tu nombre"
  oninput="
    guardarCacheUsuario();
    renderPartidos();
    cargarMiPanel();
    cargarFasesFinales();
    cargarMisResultados();
  "
/>

</div>

<!-- GRUPOS -->

<div class="card">

<div class="grupo-header">

<button
  class="nav-btn"
  onclick="grupoAnterior()"
>
<
</button>

<div
  class="grupo-title"
  id="grupoTitulo"
>
Grupo A
</div>

<button
  class="nav-btn"
  onclick="grupoSiguiente()"
>
>
</button>

</div>

<div id="partidos"></div>

<div id="estadoGrupo"></div>

<div
  class="indicadores"
  id="indicadores"
></div>

<button
  class="guardar"
  onclick="confirmarGuardado()"
>
💾 Guardar Grupo
</button>

</div>

<!-- FASES -->

<div class="card">

<h2>🏆 Fases Finales</h2>

<div id="fasesFinales"></div>

<button
  class="guardar"
  onclick="guardarFasesFinales()"
>
💾 Guardar Fases Finales
</button>

</div>

<!-- RANKING -->

<div class="card">

<h2>🏆 Ranking</h2>

<div id="ranking"></div>

</div>

<!-- PANEL -->

<div class="card">

<h2>📊 Mi Quiniela</h2>

<div id="panelUsuario">

<div class="panel-usuario">

<div class="panel-item">
<div>🏆 Puntos</div>
<div>0</div>
</div>

<div class="panel-item">
<div>⭐ Exactos</div>
<div>0</div>
</div>

<div class="panel-item">
<div>📈 Posición</div>
<div>#-</div>
</div>

</div>

</div>

</div>

<!-- RESULTADOS -->

<div class="card">

<h2>📋 Mis Resultados</h2>

<div id="tablaResultadosUsuario">

<div class="ranking-item">
Sin resultados todavía
</div>

</div>

</div>

</div>

<script src="partidos.js"></script>

<script>

const grupos = [
  'A','B','C','D','E','F',
  'G','H','I','J','K','L'
];

let indiceGrupo = 0;

function guardarCacheUsuario(){

  localStorage.setItem(
    "usuarioQuiniela",
    document.getElementById(
      "usuario"
    ).value
  );

}

async function cargarMiPanel(){

  const usuario =
    document.getElementById(
      "usuario"
    ).value;

  if(!usuario) return;

  try{

    const resRanking =
      await fetch(
        "https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/ranking.json"
      );

    const rankingData =
      await resRanking.json();

    if(!rankingData) return;

    const ranking =
      Object.values(rankingData);

    ranking.sort((a,b)=>{

      if(b.puntos !== a.puntos){

        return b.puntos - a.puntos;

      }

      return b.exactos - a.exactos;

    });

    const usuarioRanking =
      ranking.find(
        r => r.usuario === usuario
      );

    let posicion = "-";

    ranking.forEach((r,i)=>{

      if(r.usuario === usuario){

        posicion = i + 1;

      }

    });

    if(usuarioRanking){

      document.getElementById(
        "panelUsuario"
      ).innerHTML = `

      <div class="panel-usuario">

        <div class="panel-item">
          <div>🏆 Puntos</div>
          <div>${usuarioRanking.puntos}</div>
        </div>

        <div class="panel-item">
          <div>⭐ Exactos</div>
          <div>${usuarioRanking.exactos}</div>
        </div>

        <div class="panel-item">
          <div>📈 Posición</div>
          <div>#${posicion}</div>
        </div>

      </div>

      `;

    }

  }catch(e){

    console.error(e);

  }

}

async function renderPartidos(){

  const usuario =
    document.getElementById(
      "usuario"
    ).value;

  if(!usuario) return;

  const grupoActual =
    grupos[indiceGrupo];

  document.getElementById(
    "grupoTitulo"
  ).innerHTML =
    `Grupo ${grupoActual}`;

  let html = "";

  let jornadaActual = "";

  const partidosGrupo =
    partidos.filter(
      p => p.grupo === grupoActual
    );

  partidosGrupo.forEach((p)=>{

    if(
      jornadaActual !== p.jornada
    ){

      jornadaActual = p.jornada;

      html += `

      <div class="jornada">
        Jornada ${jornadaActual}
      </div>

      `;

    }

    html += `

    <div class="partido">

      <div class="team">
        ${p.banderaLocal || ''} ${p.local}
      </div>

      <input
        type="number"
        class="marcador"
        id="gl${p.id}"
        min="0"
        value="0"
      >

      <input
        type="number"
        class="marcador"
        id="gv${p.id}"
        min="0"
        value="0"
      >

      <div class="team">
        ${p.banderaVisitante || ''} ${p.visitante}
      </div>

    </div>

    `;

  });

  document.getElementById(
    "partidos"
  ).innerHTML = html;

  renderIndicadores();

  await verificarGrupoGuardado();

}

function renderIndicadores(){

  let html = "";

  grupos.forEach((g,i)=>{

    html += `

    <span class="
      dot
      ${i === indiceGrupo ? 'active' : ''}
    "></span>

    `;

  });

  document.getElementById(
    "indicadores"
  ).innerHTML = html;

}

function bloquearGrupo(){

  const inputs =
    document.querySelectorAll(
      ".marcador"
    );

  inputs.forEach((i)=>{

    i.disabled = true;

  });

}

async function verificarGrupoGuardado(){

  document.getElementById(
    "estadoGrupo"
  ).innerHTML = "";

  const usuario =
    document.getElementById(
      "usuario"
    ).value;

  if(!usuario) return;

  const grupoActual =
    grupos[indiceGrupo];

  try{

    const res =
      await fetch(

        `https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/quinielas/${usuario}/grupos/${grupoActual}.json`

      );

    const data =
      await res.json();

    if(data){

      data.pronosticos.forEach((p)=>{

        const gl =
          document.getElementById(
            `gl${p.partidoId}`
          );

        const gv =
          document.getElementById(
            `gv${p.partidoId}`
          );

        if(gl && gv){

          gl.value =
            p.golesLocal;

          gv.value =
            p.golesVisitante;

          gl.disabled = true;
          gv.disabled = true;

        }

      });

      document.getElementById(
        "estadoGrupo"
      ).innerHTML = `

      <div class="grupo-bloqueado">
        🔒 ${grupoActual} guardado
      </div>

      `;

    }

  }catch(e){

    console.error(e);

  }

}

function grupoSiguiente(){

  if(
    indiceGrupo <
    grupos.length - 1
  ){

    indiceGrupo++;

    renderPartidos();

  }

}

function grupoAnterior(){

  if(indiceGrupo > 0){

    indiceGrupo--;

    renderPartidos();

  }

}

function confirmarGuardado(){

  const grupoActual =
    grupos[indiceGrupo];

  const ok = confirm(
    `¿Guardar ${grupoActual}?`
  );

  if(ok){

    guardarGrupo();

  }

}

async function guardarGrupo(){

  const usuario =
    document.getElementById(
      "usuario"
    ).value;

  if(!usuario){

    alert(
      "Ingresa tu nombre"
    );

    return;

  }

  const grupoActual =
    grupos[indiceGrupo];

  const partidosGrupo =
    partidos.filter(
      p => p.grupo === grupoActual
    );

  let pronosticos = [];

  partidosGrupo.forEach((p)=>{

    pronosticos.push({

      partidoId:p.id,
      grupo:p.grupo,
      local:p.local,
      visitante:p.visitante,

      golesLocal:parseInt(
        document.getElementById(
          `gl${p.id}`
        ).value
      ),

      golesVisitante:parseInt(
        document.getElementById(
          `gv${p.id}`
        ).value
      )

    });

  });

  await firebaseSet(

    firebaseRef(
      db,
      `quinielas/${usuario}/grupos/${grupoActual}`
    ),

    {
      fecha:new Date().toISOString(),
      pronosticos
    }

  );

  renderPartidos();

  cargarMisResultados();

  alert(
    `🔥 ${grupoActual} guardado`
  );

}

async function cargarFasesFinales(){

  const fases = [
    'OCTAVOS',
    'CUARTOS',
    'SEMIFINAL',
    'FINAL'
  ];

  const usuario =
    document.getElementById(
      "usuario"
    ).value;

  let html = '';

  for(const fase of fases){

    const res = await fetch(

      `https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/fasesFinales/${fase}.json`

    );

    const data =
      await res.json();

    if(!data) continue;

    html += `

    <div class="fase-label">
      🏆 ${fase}
    </div>

    `;

    let pronosticosGuardados = null;

    if(usuario){

      const resUsuario = await fetch(

        `https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/quinielas/${usuario}/fasesFinales/${fase}.json`

      );

      pronosticosGuardados =
        await resUsuario.json();

    }

    Object.values(data).forEach((p)=>{

      let gl = 0;
      let gv = 0;
      let disabled = '';

      if(
        pronosticosGuardados &&
        pronosticosGuardados.pronosticos
      ){

        const encontrado =
          pronosticosGuardados
          .pronosticos
          .find(

            x =>
              Number(x.partidoId) ===
              Number(p.id)

          );

        if(encontrado){

          gl = encontrado.golesLocal;
          gv = encontrado.golesVisitante;

          disabled = 'disabled';

        }

      }

      html += `

      <div class="partido">

        <div class="team">
          ${p.local}
        </div>

        <input
          type="number"
          class="marcador"
          id="pfl${p.id}"
          min="0"
          value="${gl}"
          ${disabled}
        >

        <input
          type="number"
          class="marcador"
          id="pfv${p.id}"
          min="0"
          value="${gv}"
          ${disabled}
        >

        <div class="team">
          ${p.visitante}
        </div>

      </div>

      `;

    });

    if(pronosticosGuardados){

      html += `

      <div class="grupo-bloqueado">
        🔒 ${fase} guardado
      </div>

      `;

    }

  }

  if(html === ''){

    html =
      'Sin partidos finales';

  }

  document.getElementById(
    'fasesFinales'
  ).innerHTML = html;

}

async function guardarFasesFinales(){

  const usuario =
    document.getElementById(
      "usuario"
    ).value;

  if(!usuario){

    alert(
      "Ingresa tu nombre"
    );

    return;

  }

  const fases = [
    'OCTAVOS',
    'CUARTOS',
    'SEMIFINAL',
    'FINAL'
  ];

  for(const fase of fases){

    const res = await fetch(

      `https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/fasesFinales/${fase}.json`

    );

    const data =
      await res.json();

    if(!data) continue;

    const yaGuardado = await fetch(

      `https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/quinielas/${usuario}/fasesFinales/${fase}.json`

    );

    const existe =
      await yaGuardado.json();

    if(existe){

      continue;

    }

    let pronosticos = [];

    Object.values(data).forEach((p)=>{

      pronosticos.push({

        partidoId:p.id,
        fase:p.fase,
        local:p.local,
        visitante:p.visitante,

        golesLocal:parseInt(
          document.getElementById(
            `pfl${p.id}`
          ).value
        ),

        golesVisitante:parseInt(
          document.getElementById(
            `pfv${p.id}`
          ).value
        )

      });

    });

    await firebaseSet(

      firebaseRef(
        db,
        `quinielas/${usuario}/fasesFinales/${fase}`
      ),

      {

        fecha:
          new Date().toISOString(),

        pronosticos

      }

    );

  }

  cargarFasesFinales();

  cargarMisResultados();

  alert(
    '🔥 Fases finales guardadas'
  );

}

async function cargarRanking(){

  try{

    const res =
      await fetch(
        "https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/ranking.json"
      );

    const data =
      await res.json();

    let html = "";

    if(!data){

      html = `

      <div class="ranking-item">
        Sin ranking todavía
      </div>

      `;

    }else{

      const ranking =
        Object.values(data);

      ranking.sort((a,b)=>{

        if(
          b.puntos !==
          a.puntos
        ){

          return (
            b.puntos -
            a.puntos
          );

        }

        return (
          b.exactos -
          a.exactos
        );

      });

      html += `

      <div style="
        font-size:12px;
        color:#666;
        margin-bottom:10px;
        text-align:center;
      ">
        💡 P = Puntos | E = Marcador Exacto
      </div>

      <div class="ranking-item"
        style="
          font-weight:bold;
          background:#f3f4f6;
        "
      >

        <div>
          Usuario
        </div>

        <div>
          P&nbsp;&nbsp;&nbsp;E
        </div>

      </div>

      `;

      let posicionMostrada = 0;

      ranking.forEach((r,i)=>{

        if(
          i === 0 ||
          r.puntos !== ranking[i-1].puntos ||
          r.exactos !== ranking[i-1].exactos
        ){

          posicionMostrada = i + 1;

        }

        let emoji = "🏅";

        if(posicionMostrada === 1)
          emoji = "🥇";

        else if(posicionMostrada === 2)
          emoji = "🥈";

        else if(posicionMostrada === 3)
          emoji = "🥉";

        html += `

        <div class="ranking-item">

          <div>
            ${emoji} ${r.usuario}
          </div>

          <div>
            ${r.puntos}
            &nbsp;&nbsp;&nbsp;
            ${r.exactos}
          </div>

        </div>

        `;

      });

    }

    document.getElementById(
      "ranking"
    ).innerHTML = html;

  }catch(e){

    console.error(e);

  }

}

async function cargarMisResultados(){

  const usuario =
    document.getElementById(
      "usuario"
    ).value;

  if(!usuario){

    return;

  }

  const resQuiniela =
    await fetch(

      `https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/quinielas/${usuario}.json`

    );

  const quiniela =
    await resQuiniela.json();

  if(!quiniela){

    document.getElementById(
      "tablaResultadosUsuario"
    ).innerHTML =
      'Sin resultados';

    return;

  }

  let html = `

  <table class="tabla-resultados">

  <thead>

  <tr>
    <th>Partido</th>
    <th>Tu Pronóstico</th>
    <th>Resultado</th>
    <th>Puntos</th>
  </tr>

  </thead>

  <tbody>

  `;

  const resResultados =
    await fetch(

      'https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/resultados.json'

    );

  const resultados =
    await resResultados.json();

  const gruposUsuario =
    quiniela.grupos || {};

  for(const grupo in gruposUsuario){

    const pronosticos =
      gruposUsuario[grupo]
      .pronosticos || [];

    const resultadosGrupo =
      resultados?.[grupo] || [];

    pronosticos.forEach((p)=>{

      const real =
        resultadosGrupo.find(

          r =>
            Number(r.partidoId) ===
            Number(p.partidoId)

        );

      if(!real) return;

      if(real.finalizado !== true) return;

      let clase = 'fallo';
      let texto = '0';

      if(

      p.golesLocal ===
      real.golesLocal &&

      p.golesVisitante ===
       real.golesVisitante

      )

      {

  clase = 'acierto';
  texto = '2 pts';

}
      
      else{

        const pronostico =

          p.golesLocal >
          p.golesVisitante

          ? 'L'

          : p.golesLocal <
            p.golesVisitante

          ? 'V'

          : 'E';

        const resultado =

          real.golesLocal >
          real.golesVisitante

          ? 'L'

          : real.golesLocal <
            real.golesVisitante

          ? 'V'

          : 'E';

        if(pronostico === resultado){

          clase = 'parcial';
          texto = '1 pt';

        }

      }

      html += `

      <tr class="${clase}">

        <td>
          ${p.local} vs ${p.visitante}
        </td>

        <td>
          ${p.golesLocal} - ${p.golesVisitante}
        </td>

        <td>
          ${real.golesLocal} - ${real.golesVisitante}
        </td>

        <td>
          ${texto}
        </td>

      </tr>

      `;

    });

  }

  /* FASES FINALES */

  const fases = [
    'OCTAVOS',
    'CUARTOS',
    'SEMIFINAL',
    'FINAL'
  ];

  const finalesUsuario =
    quiniela.fasesFinales || {};

  for(const fase of fases){

    const pronosticos =
      finalesUsuario[fase]
      ?.pronosticos || [];

    const resFase =
      await fetch(

        `https://quiniela-mundial-juansantos-default-rtdb.firebaseio.com/fasesFinales/${fase}.json`

      );

    const resultadosFase =
      await resFase.json();

    if(!resultadosFase){

      continue;

    }

    pronosticos.forEach((p)=>{

      const real =
        Object.values(
          resultadosFase
        ).find(

          r =>
            Number(r.id) ===
            Number(p.partidoId)

        );

      if(!real) return;

      if(real.finalizado !== true) return;

      let clase = 'fallo';
      let texto = '0';

      if(

        p.golesLocal ===
        real.golesLocal &&

        p.golesVisitante ===
        real.golesVisitante

      ){

        clase = 'acierto';
        texto = '2 pts';

      }else{

        const pronostico =

          p.golesLocal >
          p.golesVisitante

          ? 'L'

          : p.golesLocal <
            p.golesVisitante

          ? 'V'

          : 'E';

        const resultado =

          real.golesLocal >
          real.golesVisitante

          ? 'L'

          : real.golesLocal <
            real.golesVisitante

          ? 'V'

          : 'E';

        if(pronostico === resultado){

          clase = 'parcial';
          texto = '1 pts';

        }

      }

      html += `

      <tr class="${clase}">

        <td>
          (${fase})
          ${p.local} vs ${p.visitante}
        </td>

        <td>
          ${p.golesLocal} - ${p.golesVisitante}
        </td>

        <td>
          ${real.golesLocal} - ${real.golesVisitante}
        </td>

        <td>
          ${texto}
        </td>

      </tr>

      `;

    });

  }

  html += `
  </tbody>
  </table>
  `;

  document.getElementById(
    "tablaResultadosUsuario"
  ).innerHTML = html;

}

window.onload = ()=>{

  const usuario =
    localStorage.getItem(
      "usuarioQuiniela"
    );

  if(usuario){

    document.getElementById(
      "usuario"
    ).value = usuario;

    renderPartidos();

    cargarMiPanel();

    cargarFasesFinales();

    cargarMisResultados();

  }

  cargarRanking();

};
